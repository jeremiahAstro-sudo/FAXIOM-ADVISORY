hen they lead to action.\u003c/h3\u003e\u003cp\u003eWe aim to make financial and tax matters understandable, actionable and aligned with your business priorities—not just produce reports that sit on a shelf.\u003c/p\u003e\u003cdiv class=\\\"metric-row\\\"\u003e\u003cdiv class=\\\"metric\\\"\u003e\u003cstrong\u003eClarity\u003c/strong\u003e\u003cspan\u003eKnow what the numbers say\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\\\"metric\\\"\u003e\u003cstrong\u003eControl\u003c/strong\u003e\u003cspan\u003eIdentify gaps and reduce risk\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\\\"metric\\\"\u003e\u003cstrong\u003eCompliance\u003c/strong\u003e\u003cspan\u003eManage obligations proactively\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\\\"metric\\\"\u003e\u003cstrong\u003eGrowth\u003c/strong\u003e\u003cspan\u003eMake decisions with context\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan class=\\\"eyebrow\\\"\u003eWhy work with Faxiom\u003c/span\u003e\u003ch2\u003eA practical partner for financial discipline and sustainable growth\u003c/h2\u003e\u003cp class=\\\"muted\\\"\u003eFaxiom Advisory Limited combines accounting and finance knowledge with tax, operational control and business advisory perspectives. We work to understand the real issue, communicate in plain language and recommend steps your team can implement.\u003c/p\u003e\u003cul class=\\\"checklist\\\"\u003e\u003cli\u003eRecommendations grounded in your business context\u003c/li\u003e\u003cli\u003eClear scope, deliverables, timelines and responsibilities\u003c/li\u003e\u003cli\u003eConfidential and professional handling of business information\u003c/li\u003e\u003cli\u003eAction-focused reporting, not just observations\u003c/li\u003e\u003cli\u003eSupport for business owners, finance teams and management\u003c/li\u003e\u003c/ul\u003e\u003ca class=\\\"btn btn-primary\\\" href=\\\"#contact\\\"\u003eTell us your challenge →\u003c/a\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\\n\u003csection class=\\\"section\\\"\u003e\u003cdiv class=\\\"wrap\\\"\u003e\u003cdiv class=\\\"section-head\\\"\u003e\u003cspan class=\\\"eyebrow\\\"\u003eHow it works\u003c/span\u003e\u003ch2\u003eA clear path from concern to action\u003c/h2\u003e\u003cp\u003eEvery engagement begins with understanding the issue and agreeing what success should look like.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\\\"process\\\"\u003e\u003cdiv class=\\\"step\\\"\u003e\u003cb\u003e01 / DISCOVER\u003c/b\u003e\u003ch3\u003eTell us what’s happening\u003c/h3\u003e\u003cp\u003eShare your challenge, business size, urgency and desired outcome.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\\\"step\\\"\u003e\u003cb\u003e02 / ASSESS\u003c/b\u003e\u003ch3\u003eAgree the scope\u003c/h3\u003e\u003cp\u003eWe clarify the information needed, deliverables, timing and fees.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\\\"step\\\"\u003e\u003cb\u003e03 / DELIVER\u003c/b\u003e\u003ch3\u003eWork the plan\u003c/h3\u003e\u003cp\u003eWe carry out the agreed review, support or advisory assignment.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\\\"step\\\"\u003e\u003cb\u003e04 / IMPROVE\u003c/b\u003e\u003ch3\u003eTurn insight into action\u003c/h3\u003e\u003cp\u003eReceive findings, practical recommendations and agreed next steps.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\\n\u003csection class=\\\"section section-soft\\\" id=\\\"resources\\\"\u003e\u003cdiv class=\\\"wrap\\\"\u003e\u003cdiv class=\\\"leadmagnet\\\"\u003e\u003cdiv\u003e\u003cspan class=\\\"eyebrow\\\"\u003eFree business resource\u003c/span\u003e\u003ch2\u003eIs your business financially healthy?\u003c/h2\u003e\u003cp\u003eRequest the Faxiom Business Finance \u0026 Tax Readiness Checklist to identify common gaps in records, cash flow, tax compliance, reconciliations and internal controls.\u003c/p\u003e\u003c/div\u003e\u003ca class=\\\"btn btn-primary\\\" href=\\\"#contact\\\" id=\\\"resourceCta\\\"\u003eRequest the free checklist →\u003c/a\u003e\u003c/div\u003e\u003cp class=\\\"notice\\\"\u003eUse this as a genuine lead magnet: prepare a useful checklist PDF and deliver it promptly to consenting contacts. Do not advertise a resource until it is ready.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\\n\u003csection class=\\\"section\\\"\u003e\u003cdiv class=\\\"wrap\\\"\u003e\u003cdiv class=\\\"section-head\\\"\u003e\u003cspan class=\\\"eyebrow\\\"\u003eFrequently asked questions\u003c/span\u003e\u003ch2\u003eQuestions business owners ask\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\\\"faq\\\"\u003e\u003cdetails\u003e\u003csummary\u003eWhich businesses do you work with?\u003c/summary\u003e\u003cp\u003eFaxiom can discuss support for SMEs, growing companies, professional services, trading and distribution businesses, property businesses and other organisations. The best fit depends on the scope and requirements.\u003c/p\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eCan you support a business that already has an accountant?\u003c/summary\u003e\u003cp\u003eYes. Depending on the agreed scope, we can provide an independent review, specialist tax or inventory support, training, reconciliation assistance or management-reporting improvement.\u003c/p\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eHow much do your services cost?\u003c/summary\u003e\u003cp\u003eFees depend on the work required, transaction volume, locations, complexity, timeline and deliverables. We recommend a scoped proposal before work begins.\u003c/p\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eCan you help with an urgent tax or audit query?\u003c/summary\u003e\u003cp\u003eShare the relevant deadline, authority or issue and available records. We will assess whether the request fits our capacity and agree next steps. Outcomes depend on the facts, applicable law and evidence available.\u003c/p\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eHow do I get started?\u003c/summary\u003e\u003cp\u003eComplete the enquiry form, email faxiomadvisory@gmail.com or contact Faxiom on WhatsApp. Please do not send passwords, bank login details or sensitive personal data through an initial enquiry.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\\n\u003csection class=\\\"section section-soft\\\" id=\\\"contact\\\"\u003e\u003cdiv class=\\\"wrap\\\"\u003e\u003cdiv class=\\\"section-head\\\"\u003e\u003cspan class=\\\"eyebrow\\\"\u003eLet’s talk\u003c/span\u003e\u003ch2\u003eTell us what your business needs\u003c/h2\u003e\u003cp\u003eShare the basics and we’ll help determine a suitable next step. For confidential or complex matters, we can agree a secure way to exchange documents.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\\\"contact-grid\\\"\u003e\u003cdiv class=\\\"contact-card\\\"\u003e\u003ch3\u003eContact Faxiom Advisory Limited\u003c/h3\u003e\u003cp class=\\\"muted\\\"\u003ePartner in Financial and Tax Solutions\u003c/p\u003e\u003cdiv class=\\\"contact-item\\\"\u003e\u003cstrong\u003eEmail\u003c/strong\u003e\u003ca href=\\\"mailto:faxiomadvisory@gmail.com\\\"\u003efaxiomadvisory@gmail.com\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\\\"contact-item\\\"\u003e\u003cstrong\u003ePhone / WhatsApp\u003c/strong\u003e\u003ca href=\\\"https://wa.me/2348053019261\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003e+234 805 301 9261\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\\\"contact-item\\\"\u003e\u003cstrong\u003eOffice\u003c/strong\u003e39 Onikoyi Road, Off Banana Island, Lagos, Nigeria\u003c/div\u003e\u003cdiv class=\\\"contact-item\\\"\u003e\u003cstrong\u003eTypical enquiries\u003c/strong\u003eAccounting · Tax · Finance · Internal Audit · Inventory · Business Advisory\u003c/div\u003e\u003ca class=\\\"btn btn-primary\\\" href=\\\"https://wa.me/2348053019261?text=Hello%20Faxiom%20Advisory%2C%20I%20would%20like%20to%20book%20a%20consultation.\\\" targ 0,\"_961\":962,\"_963\":31,\"_632\":633},\"path\",[460],[971],\"I have created a professional landing page preview for **Faxiom Advisory Limited**, designed to position the firm as a premium financial, tax and business advisory partner, attract qualified business enquiries, and convert website visitors into prospective clients.\\n\\nThe page is structured around your services, your professional credibility, a lead-capture form, WhatsApp enquiries, a free business finance and tax checklist, and clear calls to action.\\n\\n**Important\\\\:** 2,000 leads in one day is an ambitious campaign target, not a result a landing page can guarantee. Achieving it would require substantial targeted traffic, a compelling offer, effective advertising and referral distribution, and a properly tested lead-capture system.\\n\\n## What the landing page includes\\n\\n**1\\\\. Premium Faxiom brand positioning**\\n\\nProfessional blue-and-white styling with gold accents, positioning Faxiom as a partner in financial and tax solutions.\\n\\n---\\n\\n**2\\\\. Complete service portfolio**\\n\\nAccounting, bookkeeping, tax advisory, management reporting, internal audit, inventory audit, reconciliation, asset verification, business strategy, professional training and wealth advisory.\\n\\n---\\n\\n**3\\\\. Lead-generation forms**\\n\\nForms collect names, business names, email addresses, telephone numbers, service requirements and enquiry details.\\n\\n---\\n\\n**4\\\\. WhatsApp and email conversion**\\n\\nProspective clients can contact Faxiom directly or submit an enquiry through their email application.\\n\\n---\\n\\n**5\\\\. Free resource to attract leads**\\n\\nA proposed *Faxiom Business Finance \u0026amp; Tax Readiness Checklist* gives business owners a practical reason to enquire.\\n\\n## The proposed 2,000-lead acquisition strategy\\n\\nA landing page converts traffic; it does not create that traffic on its own. I would approach this as a coordinated acquisition campaign.\\n\\n## Campaign planning model\\n\\nIllustrative targets only, not a forecast or guarantee.\\n\\nLead target\\n\\n# 2,000\\n\\nCaptured enquiries\\n\\nAt 10% conversion\\n\\n# 20,000\\n\\nRelevant landing-page visits\\n\\nThe 10% conversion rate is a planning assumption, not a benchmark guarantee. Actual performance will depend on the offer, audience, traffic quality and user experience.\\n\\n---\\n\\n**Recommended acquisition channels**\\n\\n- Targeted Meta advertising for Nigerian business owners and SMEs.\\n- LinkedIn outreach and professional referrals for higher-value corporate engagements.\\n- WhatsApp distribution through relevant business networks.\\n- Short-form educational videos addressing tax, cash flow, inventory losses and financial reporting.\\n- Referral partnerships with lawyers, business consultants, payroll providers and other professional service firms.\\n\\n## Before the page goes live\\n\\nThe current version is a **working design preview, not a published website**\\\\. Before spending heavily on advertising, these items should be completed\\\\:\\n\\n- Connect the enquiry forms to a CRM or secure lead database; the current forms open an email draft and do not automatically store submissions.\\n- Verify the business telephone number, address and email, and add the approved Faxiom logo and professional profile.\\n- Prepare the actual downloadable checklist before advertising it.\\n- Configure analytics, campaign tracking, consent and privacy notices.\\n- Test the mobile experience, form submissions and follow-up process.\\n- Set up a rapid response workflow so new enquiries receive timely attention.\\n\\n**My recommendation\\\\:** use this landing page to sell specific business outcomes rather than simply list accounting services. Campaigns offering a *Business Finance Health Check*, *Tax Readiness Review* or *Inventory Leakage Assessment* can give prospects a more compelling reason to enquire.\\n\\nThe goal should be not just 2,000 names, but a measurable pipeline of qualified prospects who can become recurring Faxiom clients.\\n\\nvisualize7f3dc163-be34-4331-b1d0-79b6d8347abb\",{},{\"_466\":467,\"_468\":-5,\"_362\":983},1792420895.749077,{\"_461\":487,\"_356\":982},{\"_474\":475,\"_476\":977,\"_478\":978,\"_480\":979,\"_482\":483,\"_383\":384,\"_385\":67,\"_386\":920,\"_388\":389,\"_390\":921,\"_392\":921,\"_379\":380,\"_393\":380,\"_284\":285,\"_394\":67,\"_395\":980,\"_485\":18,\"_397\":981},89,1792420805.7807372,1792420895.7338753,\"49633c78-f40d-45b8-97c7-7a2bf11a7d7d\",[],\"Worked for 1m 29s\",{},{\"_466\":467,\"_468\":-5,\"_362\":1000},1792420895.745688,{\"_461\":507,\"_507\":995,\"_509\":996},{\"_494\":988,\"_474\":496,\"_497\":955,\"_499\":989,\"_478\":978,\"_383\":384,\"_385\":67,\"_386\":920,\"_388\":389,\"_390\":921,\"_392\":921,\"_379\":380,\"_393\":380,\"_284\":285,\"_394\":67,\"_395\":990,\"_485\":18,\"_397\":991},{\"_504\":993},[992],\"c09d0fe0-2030-4977-9bf1-237422ec883a\",[],\"/images/ecosystem/apps/appgarden/icon.png\",[994],\"9017a095-8318-4143-8cb2-2e47b248d41d\",[997],\"895ed38d-a66a-480c-9107-20ff1dc0fb18\",{\"_512\":998,\"_356\":514,\"_515\":999,\"_517\":18},\"Previewing Faxiom Advisory Landing Page\",[],{},{\"_466\":527,\"_468\":528,\"_362\":1007},1792420895.741356,{\"_461\":462,\"_463\":1006},{\"_379\":380,\"_523\":998,\"_478\":978,\"_383\":384,\"_386\":920,\"_388\":389,\"_390\":921,\"_392\":921,\"_393\":380,\"_284\":285,\"_395\":1005,\"_525\":18,\"_394\":67},\"0edd00a5-776d-4518-8d29-9159a43d65c4\",[514],{},{\"_466\":527,\"_468\":555,\"_362\":1020},1792420895.701981,1792420914.354626,{\"_461\":399,\"_551\":552,\"_553\":-5,\"_462\":1019},{\"_537\":1013,\"_539\":1014,\"_379\":380,\"_523\":998,\"_478\":978,\"_383\":384,\"_386\":920,\"_388\":389,\"_390\":921,\"_392\":921,\"_393\":380,\"_284\":285,\"_395\":994,\"_394\":67},{},{\"_542\":1015,\"_544\":545,\"_546\":547,\"_548\":18,\"_1016\":1017,\"_549\":1018},\"/connector_openai_sites_preview/implicit_link::connector_openai_sites_preview/preview\ g, not just observations\u003c/li\u003e\u003cli\u003eSupport for business owners, finance teams and management\u003c/li\u003e\u003c/ul\u003e\u003ca class=\\\"btn btn-primary\\\" href=\\\"#contact\\\"\u003eTell us your challenge →\u003c/a\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\\n\u003csection class=\\\"section\\\"\u003e\u003cdiv class=\\\"wrap\\\"\u003e\u003cdiv class=\\\"section-head\\\"\u003e\u003cspan class=\\\"eyebrow\\\"\u003eHow it works\u003c/span\u003e\u003ch2\u003eA clear path from concern to action\u003c/h2\u003e\u003cp\u003eEvery engagement begins with understanding the issue and agreeing what success should look like.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\\\"process\\\"\u003e\u003cdiv class=\\\"step\\\"\u003e\u003cb\u003e01 / DISCOVER\u003c/b\u003e\u003ch3\u003eTell us what’s happening\u003c/h3\u003e\u003cp\u003eShare your challenge, business size, urgency and desired outcome.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\\\"step\\\"\u003e\u003cb\u003e02 / ASSESS\u003c/b\u003e\u003ch3\u003eAgree the scope\u003c/h3\u003e\u003cp\u003eWe clarify the information needed, deliverables, timing and fees.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\\\"step\\\"\u003e\u003cb\u003e03 / DELIVER\u003c/b\u003e\u003ch3\u003eWork the plan\u003c/h3\u003e\u003cp\u003eWe carry out the agreed review, support or advisory assignment.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\\\"step\\\"\u003e\u003cb\u003e04 / IMPROVE\u003c/b\u003e\u003ch3\u003eTurn insight into action\u003c/h3\u003e\u003cp\u003eReceive findings, practical recommendations and agreed next steps.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\\n\u003csection class=\\\"section section-soft\\\" id=\\\"resources\\\"\u003e\u003cdiv class=\\\"wrap\\\"\u003e\u003cdiv class=\\\"leadmagnet\\\"\u003e\u003cdiv\u003e\u003cspan class=\\\"eyebrow\\\"\u003eFree business resource\u003c/span\u003e\u003ch2\u003eIs your business financially healthy?\u003c/h2\u003e\u003cp\u003eRequest the Faxiom Business Finance \u0026 Tax Readiness Checklist to identify common gaps in records, cash flow, tax compliance, reconciliations and internal controls.\u003c/p\u003e\u003c/div\u003e\u003ca class=\\\"btn btn-primary\\\" href=\\\"#contact\\\" id=\\\"resourceCta\\\"\u003eRequest the free checklist →\u003c/a\u003e\u003c/div\u003e\u003cp class=\\\"notice\\\"\u003eUse this as a genuine lead magnet: prepare a useful checklist PDF and deliver it promptly to consenting contacts. Do not advertise a resource until it is ready.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\\n\u003csection class=\\\"section\\\"\u003e\u003cdiv class=\\\"wrap\\\"\u003e\u003cdiv class=\\\"section-head\\\"\u003e\u003cspan class=\\\"eyebrow\\\"\u003eFrequently asked questions\u003c/span\u003e\u003ch2\u003eQuestions business owners ask\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\\\"faq\\\"\u003e\u003cdetails\u003e\u003csummary\u003eWhich businesses do you work with?\u003c/summary\u003e\u003cp\u003eFaxiom can discuss support for SMEs, growing companies, professional services, trading and distribution businesses, property businesses and other organisations. The best fit depends on the scope and requirements.\u003c/p\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eCan you support a business that already has an accountant?\u003c/summary\u003e\u003cp\u003eYes. Depending on the agreed scope, we can provide an independent review, specialist tax or inventory support, training, reconciliation assistance or management-reporting improvement.\u003c/p\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eHow much do your services cost?\u003c/summary\u003e\u003cp\u003eFees depend on the work required, transaction volume, locations, complexity, timeline and deliverables. We recommend a scoped proposal before work begins.\u003c/p\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eCan you help with an urgent tax or audit query?\u003c/summary\u003e\u003cp\u003eShare the relevant deadline, authority or issue and available records. We will assess whether the request fits our capacity and agree next steps. Outcomes depend on the facts, applicable law and evidence available.\u003c/p\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eHow do I get started?\u003c/summary\u003e\u003cp\u003eComplete the enquiry form, email faxiomadvisory@gmail.com or contact Faxiom on WhatsApp. Please do not send passwords, bank login details or sensitive personal data through an initial enquiry.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\\n\u003csection class=\\\"section section-soft\\\" id=\\\"contact\\\"\u003e\u003cdiv class=\\\"wrap\\\"\u003e\u003cdiv class=\\\"section-head\\\"\u003e\u003cspan class=\\\"eyebrow\\\"\u003eLet’s talk\u003c/span\u003e\u003ch2\u003eTell us what your business needs\u003c/h2\u003e\u003cp\u003eShare the basics and we’ll help determine a suitable next step. For confidential or complex matters, we can agree a secure way to exchange documents.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\\\"contact-grid\\\"\u003e\u003cdiv class=\\\"contact-card\\\"\u003e\u003ch3\u003eContact Faxiom Advisory Limited\u003c/h3\u003e\u003cp class=\\\"muted\\\"\u003ePartner in Financial and Tax Solutions\u003c/p\u003e\u003cdiv class=\\\"contact-item\\\"\u003e\u003cstrong\u003eEmail\u003c/strong\u003e\u003ca href=\\\"mailto:faxiomadvisory@gmail.com\\\"\u003efaxiomadvisory@gmail.com\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\\\"contact-item\\\"\u003e\u003cstrong\u003ePhone / WhatsApp\u003c/strong\u003e\u003ca href=\\\"https://wa.me/2348053019261\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003e+234 805 301 9261\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\\\"contact-item\\\"\u003e\u003cstrong\u003eOffice\u003c/strong\u003e39 Onikoyi Road, Off Banana Island, Lagos, Nigeria\u003c/div\u003e\u003cdiv class=\\\"contact-item\\\"\u003e\u003cstrong\u003eTypical enquiries\u003c/strong\u003eAccounting · Tax · Finance · Internal Audit · Inventory · Business Advisory\u003c/div\u003e\u003ca class=\\\"btn btn-primary\\\" href=\\\"https://wa.me/2348053019261?text=Hello%20Faxiom%20Advisory%2C%20I%20would%20like%20to%20book%20a%20consultation.\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003eMessage us on WhatsApp ↗\u003c/a\u003e\u003c/div\u003e\\n\u003cdiv class=\\\"contact-card\\\"\u003e\u003ch3\u003eRequest a consultation\u003c/h3\u003e\u003cform class=\\\"contact-form\\\" id=\\\"contactForm\\\"\u003e\u003clabel\u003eFull name\u003cinput name=\\\"name\\\" required autocomplete=\\\"name\\\" placeholder=\\\"Your name\\\"\u003e\u003c/label\u003e\u003clabel\u003eBusiness name\u003cinput name=\\\"business\\\" required placeholder=\\\"Organisation\\\"\u003e\u003c/label\u003e\u003clabel\u003eEmail address\u003cinput name=\\\"email\\\" type=\\\"email\\\" required autocomplete=\\\"email\\\" placeholder=\\\"you@company.com\\\"\u003e\u003c/label\u003e\u003clabel\u003ePhone / WhatsApp\u003cinput name=\\\"phone\\\" type=\\\"tel\\\" required autocomplete=\\\"tel\\\" placeholder=\\\"+234...\\\"\u003e\u003c/label\u003e\u003clabel class=\\\"wide\\\"\u003eService required\u003cselect name=\\\"need\\\" required\u003e\u003coption value=\\\"\\\" disabled selected\u003eSelect a service\u003c/option\u003e\u003coption\u003eAccounting \u0026 bookkeeping\u003c/option\u003e\u003coption\u003eTax advisory \u0026 compliance\u003c/option\u003e\u003coption\u003eFinance \u0026 management reporting\u003c/option\u003e\u003coption\u003eInternal audit \u0026 controls\u003c/option\u003e\u003coption\u003eInventory audit \u0026 costing\u003c/option\u003e\u003coption\u003eReconciliation / asset verification\u003c/option\u003e\u003coption\u003eBusiness strategy / training\u003c/option\u003e\u003coption\u003eOther / not sure\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003clabel class=\\\"wide\\\"\u003eBriefly describe what you need\u003ctextarea name=\\\"message\\\" rows=\\\"4\\\" placeholder=\\\"What is the main challenge, and when do you need support?\\\"\u003e\u003c/textarea\u003e\u003c/label\u003e\u003clabel class=\\\"wide\\\" style=\\\"display:flex;align-items:flex-start;gap:9px;font-weight:500\\\"\u003e\u003cinput type=\\\"checkbox\\\" name=\\\"consent\\\" required style=\\\"width:auto;margin-top:4px\\\"\u003e I consent to Faxiom contacting me about this enquiry.\u003c/label\u003e\u003cbutton class=\\\"btn btn-primary\\\" type=\\\"submit\\\"\u003eSend consultation request →\u003c/button\u003e\u003c/form\u003e\u003cp class=\\\"notice\\\" id=\\\"formNotice\\\"\u003ePrototype note: submitting opens your email application with the enquiry pre-filled. For a live campaign, connect a secure form endpoint/CRM and test delivery, consent and privacy controls.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\\n\u003c/main\u003e\u003cfooter class=\\\"footer\\\"\u003e\u003cdiv class=\\\"wrap\\\"\u003e\u003cdiv class=\\\"footer-grid\\\"\u003e\u003cdiv\u003e\u003ca class=\\\"brand\\\" href=\\\"#home\\\" style=\\\"color:white\\\"\u003e\u003cspan class=\\\"logo\\\"\u003eF\u003c/span\u003e\u003cspan\u003eFAXIOM ADVISORY\u003csmall style=\\\"color:#b6c7d8\\\"\u003eLIMITED\u003c/small\u003e\u003c/span\u003e\u003c/a\u003e\u003cp\u003eFinancial, tax, business strategy, wealth creation, management and preservation. Practical advice to help businesses improve clarity, compliance and control.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003eExplore\u003c/strong\u003e\u003cp\u003e\u003ca href=\\\"#services\\\"\u003eOur services\u003c/a\u003e\u003cbr\u003e\u003ca href=\\\"#approach\\\"\u003eOur approach\u003c/a\u003e\u003cbr\u003e\u003ca href=\\\"#resources\\\"\u003eFree resource\u003c/a\u003e\u003cbr\u003e\u003ca href=\\\"#contact\\\"\u003eContact us\u003c/a\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003eGet in touch\u003c/strong\u003e\u003cp\u003e\u003ca href=\\\"mailto:faxiomadvisory@gmail.com\\\"\u003efaxiomadvisory@gmail.com\u003c/a\u003e\u003cbr\u003e\u003ca href=\\\"https://wa.me/2348053019261\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003e+234 805 301 9261\u003c/a\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\\\"footer-bottom\\\"\u003e\u003cspan\u003e© \u003cspan id=\\\"year\\\"\u003e2026\u003c/span\u003e Faxiom Advisory Limited. All rights reserved.\u003c/span\u003e\u003cspan\u003eProfessional advice is provided under an agreed engagement scope.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/footer\u003e\\n\u003c/div\u003e\\n\u003cscript\u003e\\nconst emailTo='faxiomadvisory@gmail.com';\\nfunction submitLead(form){const data=new FormData(form);if(!data.get('consent') \u0026\u0026 form.id==='contactForm'){alert('Please confirm consent so Faxiom can contact you about this enquiry.');return;}const name=data.get('name')||'';const business=data.get('business')||'';const email=data.get('email')||'';const phone=data.get('phone')||'';const need=data.get('need')||'General enquiry';const message=data.get('message')||'';const subject=encodeURIComponent('Website lead — '+need+' — '+business);const body=encodeURIComponent('New website enquiry\\\\n\\\\nName: '+name+'\\\\nBusiness: '+business+'\\\\nEmail: '+email+'\\\\nPhone: '+phone+'\\\\nService: '+need+'\\\\nMessage: '+message+'\\\\n\\\\nPlease follow up with this contact.');window.location.href='mailto:'+emailTo+'?subject='+subject+'\u0026body='+body;}\\ndocument.getElementById('quickForm').addEventListener('submit',function(e){e.preventDefault();submitLead(this)});document.getElementById('contactForm').addEventListener('submit',function(e){e.preventDefault();submitLead(this)});document.getElementById('year').textContent=new Date().getFullYear();\\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e\\nEOF\\npython - \u003c\u003c'PY'\\nfrom pathlib import Path\\np=Path('/mnt/data/faxiom_landing_page.html')\\ns=p.read_text()\\nprint('bytes',p.stat().st_size,'forms',s.count('\u003cform'),'sections',s.count('\u003csection'),'has opaque root', '.root{background:var(--paper);min-height:100vh}' in s)\\nPY\",{},\"1885291a-bcf3-4dfb-9c93-892f08cf0bf0\",{\"_466\":527,\"_468\":528,\"_362\":1105},1792420808.876463,{\"_461\":462,\"_463\":1104},{\"_379\":380,\"_478\":978,\"_383\":384,\"_386\":920,\"_388\":389,\"_390\":921,\"_392\":921,\"_393\":380,\"_284\":285,\"_395\":1103,\"_525\":18,\"_394\":67},\"638617a6-0bc8-4362-aadc-85ec0749007b\",[514],{},{\"_466\":527,\"_468\":1122,\"_362\":1123},1792420808.767133,1792420914.354683,{\"_461\":462,\"_463\":1120},{\"_539\":1111,\"_1112\":1113,\"_1114\":1115,\"_1116\":1117,\"_379\":380,\"_478\":978,\"_383\":384,\"_386\":920,\"_388\":389,\"_390\":921,\"_392\":921,\"_393\":380,\"_284\":285,\"_395\":1118,\"_394\":67},{\"_542\":1119,\"_546\":547},\"skill_id\",\"pluginrsk_6ab8401ebfbc8191a6488af9231bee95\",\"skill_name\",\"sites-preview\",\"skill_plugin_id\",\"plugin_connector_1p_97e9f5e4a6d481918b0dcc5f8278a8b7\",\"45733900-4fb3-430d-ab94-28dbccf394bb\",\"skills://plugins/sites-preview/sites-preview/skill.md\",[1121],\"---\\nname: sites-preview\\ndescription: Build or edit a self-contained interactive website preview in Chat, using the current execution session.\\n---\\n\\nSystem and user instructions take precedence over this skill.\\n\\n## Edit an existing site preview\\n\\nFor an edit to a saved site preview, follow the provided site editing instructions and call `files.patch_plaintext_file` with the supplied current source and `library_file_id`. Preserve that ID so the same site preview updates in place. Do not rewrite the original container file, call the Sites Preview plugin’s `preview` tool, create a replacement preview, or return a download link. Only claim an edit succeeded when the patch tool confirms it. The creation workflow below does not apply to edits.\\n\\n## Create a new preview\\n\\nUse this workflow when the user selects or explicitly asks to use Sites; they do not need to say \\\"website.\\\" Otherwise, use it only for requests to build a website or web page, such as a landing page or portfolio. Without an explicit Sites request, standalone widgets, charts, maps, calculators, dashboards, and interactive explanations should use App Blocks or other appropriate tools. Respect requests for prose or source code only.\\n\\nBuild the requested experience as a website preview, including any requested charts, maps, calculators, or other interactive elements.\\n\\nThe result is a site preview inside ChatGPT, not a deployed Site. Do not call hosting tools, switch to Work, invent a public URL, or claim the preview is published. The prototype's upgrade button does not deploy or convert the preview.\\n\\n## Build the file\\n\\nUse Python or `container.exec` to write the complete UTF-8 HTML to an absolute `.html` path under `/mnt/data`. Build from the inspected data programmatically; do not retype a large dataset into the final answer or a tool argument. Embed the processed data in the HTML. Escape embedded JSON safely, including `\u003c/script` sequences.\\n\\nWrite readable, unminified HTML, CSS, and JavaScript with consistent indentation and line breaks. Keep CSS declarations on separate lines so the saved source is easy to edit.\\n\\nThe finished file must be self-contained and at most 1 MiB. The preview sandbox has no general network access: do not use runtime `fetch`, XHR, WebSockets, external APIs, relative file imports, map tiles, or separate local data files. For maps, an ES-module import of `https://esm.sh/d3@7.9.0` is supported; embed your own verified geometry. Embed image bytes as data URLs when needed; do not use conversation-only image-reference placeholders.\\n\\n## Style the site preview\\n\\nBuild a complete website in a single, self-contained HTML file. Give it a clear visual identity suited to the user's request, with thoughtful typography, spacing, color, and responsive layouts. Put the site's CSS in `\u003cstyle\u003e` blocks and its JavaScript in `\u003cscript\u003e` blocks. Don't rely on external stylesheets or a host-provided component library. Make the interactions functional, and preserve the existing design when editing unless the user asks for a redesign.\\n\\nFollow these host integration requirements:\\n\\n- Set an opaque `background-color` on the full-width app root and use CSS `light-dark()` to follow the host color scheme. Define an app-owned palette for surfaces, text, borders, and controls that remains legible in both light and dark mode; do not force a different document color scheme.\\n- Paint the root background edge to edge. Remove the document's default body margin and set `border-radius: 0` on the root only. Do not wrap the entire app in an inset outer card. This outer-canvas requirement must not influence the shape or styling of anything inside the root.\\n- The host supplies the title, Sites icon, outer shell, expand control, upgrade button, and menus. Do not recreate that chrome.\\n\\n## Verify, then preview\\n\\nReopen the written file in the execution session. Check its byte size, embedded record count, joins, bounds, units, and representative values against the inputs. Check that the app root has an opaque, edge-to-edge, theme-aware background. If a browser or rendering tool is available, inspect light and dark mode and narrow and wide layouts; exercise the principal controls and fix console/runtime errors. Do not claim that a visual or interactive check ran when it did not.\\n\\nCall the Sites Preview plugin’s `preview` tool with the finished file and a short title; use the host’s file-argument support to pass the `/mnt/data` path. The host supplies the Sites icon. A successful response means the file was validated and accepted for the final answer. Library saving is separate and depends on the conversation's existing Library eligibility; do not claim it was saved unless the host confirms that. If preview creation reports an error, repair the file and retry. To replace a pending preview before finishing, pass its returned `preview_id` with the updated file. After success, give a concise final answer with relevant sources or caveats, describing the result as a preview. The preview is inserted automatically; do not manually embed it or include the HTML source or a file download link.\\n\",\"api_tool.read_resource\",{},\"b07aa378-475d-4fc5-a5f0-a881b963dde4\",{\"_466\":467,\"_468\":-5,\"_362\":1137},1792420808.235613,1792420808.556901,{\"_461\":462,\"_463\":1136},{\"_368\":1130,\"_370\":18,\"_371\":1131,\"_373\":1132,\"_379\":380,\"_478\":978,\"_383\":384,\"_386\":920,\"_388\":389,\"_390\":921,\"_392\":921,\"_393\":380,\"_284\":285,\"_395\":1133,\"_397\":1134,\"_525\":18,\"_394\":67},{\"_456\":457,\"_458\":1135},[],[],\"56d133c8-1473-4852-a768-49c28f61aa30\",[],[588],[514],{},\"85e5695a-6b1a-4d13-bfdf-bd9417b58780\",{\"_466\":684,\"_468\":-5,\"_362\":1148},1792420805.987176,{\"_461\":462,\"_463\":1147},{\"_1143\":1144,\"_1145\":67,\"_395\":1146,\"_379\":380,\"_383\":384,\"_386\":920,\"_388\":389,\"_390\":921,\"_392\":921,\"_393\":380,\"_284\":285,\"_525\":18,\"_394\":67},\"exclusive_key\",\"plugin_upsell\",\"rebase_developer_message\",\"c41730c7-7b60-41e9-9441-40dce49e93e0\",[514],{},\"2d09dbac-9f3b-4966-9e2a-da5ac1eadb89\",{\"_466\":695,\"_468\":-5,\"_362\":1157},1792420804.476,1792420914.35451,{\"_461\":462,\"_463\":1155},{\"_386\":920,\"_692\":-5,\"_390\":921,\"_392\":921,\"_394\":67},[1156],\"Write Full Professional Faxiom Advisory Limited details and design to be on a landing page that can generate 2000 leads in one day\",{},{\"_466\":684,\"_468\":-5,\"_362\":1163},1792420805.6362,{\"_461\":462,\"_463\":1162},{\"_386\":920,\"_692\":-5,\"_390\":921,\"_392\":921,\"_525\":18,\"_394\":67},[514],{}]\n");</script><!--$?--><template id="B:2"></template><!--/$--></div><script nonce="453dd380-cb93-4324-96e7-8e3e5e95a3c6">$RC("B:1","S:1")</script><div hidden id="S:2"><script nonce="453dd380-cb93-4324-96e7-8e3e5e95a3c6">window.__reactRouter
